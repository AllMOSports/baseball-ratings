name: Baseball Top-20 Matchup Finder
 
on:
  schedule:
    - cron: "0 13 * * *"   # 8:00 AM CT daily
 
  workflow_dispatch:
    inputs:
      date_override:
        description: "Scrape a specific date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
 
jobs:
  find-matchups:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pytz pillow
 
      # ── Option A: ratings files committed to repo (default) ───────────────
      # Nothing extra needed — already checked out above.
      #
      # ── Option B: ratings files uploaded as artifacts by ratings workflow ──
      # Uncomment below and set workflow: to your ratings workflow filename.
      #
      # - name: Download ratings artifacts
      #   uses: dawidd6/action-download-artifact@v3
      #   with:
      #     workflow: baseball_ratings.yml
      #     name: ratings-json
      #     path: .
 
      - name: Find Top-20 matchups
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: |
          if [ -n "$DATE_OVERRIDE" ]; then
            export MSHSAA_DATE_OVERRIDE="$DATE_OVERRIDE"
          fi
          python top20_matchups.py
 
      - name: Generate matchup image
        run: python generate_matchup_image.py
 
      - name: Upload matchup report and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top20-matchup-report
          path: |
            top20_matchups.md
            top20_matchups.png
          retention-days: 30
